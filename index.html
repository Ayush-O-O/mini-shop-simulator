<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mini Shop Simulator</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="game">
        <h1>🏪 Mini Shop Simulator</h1>

        <div class="stats">
            <div>💰 Money: ₹<span id="money">1000</span></div>
            <div>📦 Stock: <span id="stock">10</span></div>
            <div>👥 Customers: <span id="customers">0</span></div>
        </div>

        <div class="shop">
            <h2>My Shop</h2>
            <p>Sell products to customers and earn money!</p>

            <button onclick="buyStock()">📦 Buy Stock - ₹100</button>
            <button onclick="serveCustomer()">🛒 Serve Customer</button>
        </div>

        <div id="message">Welcome to your shop!</div>
    </div>

    <script src="script.js"></script>
</body>
</html>
